<aside class="user-sidebar">

  <div class="sidebar-content">

    <!-- =================================================
         LOGO
         ================================================= -->

    <div class="sidebar-logo-container">

      <a>

        <img
          src="logo.svg"
          alt="Doc-Tooth"
          class="sidebar-logo"
        >

      </a>

    </div>


    <!-- Separador -->

    <div class="sidebar-divider"></div>


    <!-- =================================================
         NAVEGACIÓN
         ================================================= -->

    <nav class="sidebar-navigation">


      <!-- =============================================
           INICIO - OPCIÓN FIJA
           ============================================= -->

      <a
        routerLink="home"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="sidebar-item"
      >

                <span class="sidebar-icon">

                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      xmlns="http://www.w3.org/2000/svg"
                    >

                        <path
                          d="M3.5 10.5L12 3.5L20.5 10.5"
                          stroke="currentColor"
                          stroke-width="1.8"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        />

                        <path
                          d="M5.5 9.5V20H18.5V9.5"
                          stroke="currentColor"
                          stroke-width="1.8"
                          stroke-linejoin="round"
                        />

                        <path
                          d="M9.5 20V14H14.5V20"
                          stroke="currentColor"
                          stroke-width="1.8"
                          stroke-linejoin="round"
                        />

                    </svg>

                </span>

        <span class="sidebar-label">
                    Inicio
                </span>

      </a>


      <!-- =============================================
           OPCIONES DINÁMICAS
           ============================================= -->

      @for (item of menuItems; track item.route) {

        <a
          [routerLink]="item.route"
          routerLinkActive="active"
          class="sidebar-item"
        >

          <!-- Icono -->

          <span class="sidebar-icon">

                        @switch (item.icon) {

                          @case ('calendar') {

                            <svg
                              viewBox="0 0 24 24"
                              fill="none"
                              xmlns="http://www.w3.org/2000/svg"
                            >

                                    <rect
                                      x="4"
                                      y="5"
                                      width="16"
                                      height="15"
                                      rx="2"
                                      stroke="currentColor"
                                      stroke-width="1.8"
                                    />

                                    <path
                                      d="M8 3V7"
                                      stroke="currentColor"
                                      stroke-width="1.8"
                                      stroke-linecap="round"
                                    />

                                    <path
                                      d="M16 3V7"
                                      stroke="currentColor"
                                      stroke-width="1.8"
                                      stroke-linecap="round"
                                    />

                                    <path
                                      d="M4 10H20"
                                      stroke="currentColor"
                                      stroke-width="1.8"
                                    />

                                </svg>

                          }


                          @case ('history') {

                            <svg
                              viewBox="0 0 24 24"
                              fill="none"
                              xmlns="http://www.w3.org/2000/svg"
                            >

                                    <path
                                      d="M4 12C4 7.58 7.58 4 12 4C16.42 4 20 7.58 20 12C20 16.42 16.42 20 12 20"
                                      stroke="currentColor"
                                      stroke-width="1.8"
                                      stroke-linecap="round"
                                    />

                                    <path
                                      d="M4 7V12H9"
                                      stroke="currentColor"
                                      stroke-width="1.8"
                                      stroke-linecap="round"
                                      stroke-linejoin="round"
                                    />

                                    <path
                                      d="M12 8V12L15 14"
                                      stroke="currentColor"
                                      stroke-width="1.8"
                                      stroke-linecap="round"
                                      stroke-linejoin="round"
                                    />

                                </svg>

                          }


                          @case ('appointments') {

                            <svg
                              viewBox="0 0 24 24"
                              fill="none"
                              xmlns="http://www.w3.org/2000/svg"
                            >

                                    <path
                                      d="M6 4H18C19.1 4 20 4.9 20 6V18C20 19.1 19.1 20 18 20H6C4.9 20 4 19.1 4 18V6C4 4.9 4.9 4 6 4Z"
                                      stroke="currentColor"
                                      stroke-width="1.8"
                                    />

                                    <path
                                      d="M8 8H16"
                                      stroke="currentColor"
                                      stroke-width="1.8"
                                      stroke-linecap="round"
                                    />

                                    <path
                                      d="M8 12H16"
                                      stroke="currentColor"
                                      stroke-width="1.8"
                                      stroke-linecap="round"
                                    />

                                    <path
                                      d="M8 16H13"
                                      stroke="currentColor"
                                      stroke-width="1.8"
                                      stroke-linecap="round"
                                    />

                                </svg>

                          }


                          @default {

                            <svg
                              viewBox="0 0 24 24"
                              fill="none"
                              xmlns="http://www.w3.org/2000/svg"
                            >

                                    <circle
                                      cx="12"
                                      cy="12"
                                      r="8"
                                      stroke="currentColor"
                                      stroke-width="1.8"
                                    />

                                </svg>

                          }

                        }

                    </span>


          <!-- Texto -->

          <span class="sidebar-label">
                        {{ item.label }}
                    </span>

        </a>

      }

    </nav>

  </div>

</aside>
