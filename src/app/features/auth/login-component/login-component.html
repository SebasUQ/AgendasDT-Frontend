<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Iniciar sesión | Doc-Tooth</title>

</head>

<body>

<section>
  <app-navbar-component/>
</section>

<main class="login-page">

  <!-- Decoración del fondo -->
  <div class="background-decoration decoration-one"></div>
  <div class="background-decoration decoration-two"></div>


  <!-- Tarjeta de inicio de sesión -->
  <section class="login-card">

    <!-- Logo / encabezado -->
    <div class="login-header">

      <h1>Doc-Tooth</h1>

      <p>Gestión Odontológica Integral</p>

    </div>


    <!-- Línea decorativa -->
    <div class="separator"></div>


    <!-- Formulario -->
    <form class="login-form">

      <!-- Correo -->
      <div class="form-group">

        <label for="email">
          Documento / Identificación
        </label>

        <input
          type="text"
          id="doc"
          name="doc"
          inputmode="numeric"
          pattern="[0-9]+"
          maxlength="15"
          placeholder="Numero de Documento"
          autocomplete="username"
          required
        >

      </div>

      <!-- Contraseña -->
      <div class="form-group">

        <label for="password">
          Contraseña
        </label>

        <input
          type="password"
          id="password"
          name="password"
          placeholder="Ingresa tu contraseña"
          autocomplete="current-password"
          required
        >

      </div>

      <!-- Opciones -->
      <div class="login-options">

        <label class="remember-me">

          <input
            type="checkbox"
            name="remember"
          >

          <span>Recordarme</span>

        </label>

        <a href="#" class="forgot-password">
          ¿Olvidaste tu contraseña?
        </a>

      </div>


      <!-- Botón -->
      <button
        type="submit"
        class="login-button"
      >
        Iniciar sesión
      </button>

    </form>


    <!-- Registro -->
    <div class="register-section">

      <div class="separator"></div>

      <p>
        ¿Aún no tienes una cuenta?
      </p>

      <a href="/authentication/register" class="register-link">
        Regístrate aquí
      </a>

    </div>

  </section>

</main>

</body>

</html>
